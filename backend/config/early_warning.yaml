# Keep discovery query/country policy here. Enable/disable early warning in
# config/pipelines.yaml (together with the official pipeline switch).
countries:
  - code: GB
    name: United Kingdom
    aliases: [UK, Royaume-Uni, Vereinigtes Königreich]
    languages: [en]
    domains: [food.gov.uk]
    enabled: true
  - code: FR
    name: France
    aliases: [France, Frankreich]
    languages: [fr]
    domains: [gouv.fr]
    enabled: true
  - code: DE
    name: Germany
    aliases: [Deutschland, Allemagne]
    languages: [de]
    domains: [bund.de, lebensmittelwarnung.de]
    enabled: true

languages:
  en:
    recall: [food recall, product withdrawal, food safety alert]
    food: [food, beverage]
    outbreak: [foodborne outbreak]
    illness: [food poisoning, illnesses]
    contamination: [contamination, contaminated]
    investigation: [food safety investigation]
  fr:
    recall: [rappel de produit, alerte alimentaire, retrait de produit]
    food: [aliment, boisson]
    outbreak: [éclosion d'origine alimentaire]
    illness: [intoxication alimentaire, maladies]
    contamination: [contamination, contaminé]
    investigation: [enquête de sécurité alimentaire]
  de:
    recall: [lebensmittelwarnung, produktrückruf, rückrufaktion]
    food: [lebensmittel, getränk]
    outbreak: [lebensmittelbedingter ausbruch]
    illness: [lebensmittelvergiftung, erkrankungen]
    contamination: [verunreinigung, kontaminiert]
    investigation: [lebensmitteluntersuchung]

terms:
  path_signals: [recall, recalls, alert, alerts, warning, withdrawal, rappel, rueckruf, rückruf]
  exclusions: [automobile, vehicle recall, software update]

domains:
  trusted:
    - food.gov.uk
    - gouv.fr
    - bundesregierung.de
    - lebensmittelwarnung.de
    - who.int
    - fao.org
    - foodsafetynews.com
  excluded: [facebook.com, instagram.com, linkedin.com, x.com, youtube.com]
  profiles:
    food.gov.uk: {source_kind: official_recall, trust_tier: official}
    gouv.fr: {source_kind: government_investigation, trust_tier: official}
    lebensmittelwarnung.de: {source_kind: official_recall, trust_tier: official}
    who.int: {source_kind: who_fao, trust_tier: high}
    fao.org: {source_kind: who_fao, trust_tier: high}
    foodsafetynews.com: {source_kind: trade_publication, trust_tier: medium}

budgets:
  queries_per_run: 12
  results_per_query: 10
  candidates_per_run: 200
  max_pages_per_query: 1

thresholds:
  accept: 0.68
  reject: 0.32

confidence:
  recall_term: 0.30
  food_term: 0.20
  trusted_domain: 0.20
  country_domain: 0.10
  path_signal: 0.10
  description: 0.10

brave:
  freshness: pd
  timeout_seconds: 15
  minimum_interval_seconds: 1
  max_retries: 3
  backoff_seconds: 0.5
  jitter_seconds: 0.2

crawl:
  concurrency: 4
  minimum_text_characters: 240
  timeout_seconds: 20
  max_attempts: 3
  retry_delay_minutes: 360

scheduler:
  interval_minutes: 360
  run_immediately: false

incident_confidence:
  source_kind_base_weights:
    official_recall: 100
    government_investigation: 95
    who_fao: 90
    company_release: 85
    major_news: 75
    trade_publication: 65
    unknown: 40
    blog: 20
  corroboration_per_source: 5
  corroboration_cap: 15
  explicit_product_modifier: 4
  explicit_hazard_modifier: 4
  explicit_date_modifier: 2
  trusted_domain_modifier: 5
  stale_reporting_modifier: -10
  vague_reporting_modifier: -10
  unofficial_cap: 99

# Keep disabled until similarity thresholds have been calibrated against
# labelled duplicate/non-duplicate incident fixtures.
semantic_matching:
  enabled: false
  collection_name: safety_event_similarity_v1
  model_name: all-MiniLM-L6-v2
  review_threshold: 0.82
  auto_merge_threshold: 0.92
  result_limit: 10
